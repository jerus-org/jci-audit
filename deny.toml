[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Vulnerabilities are always denied by cargo-deny. unmaintained/unsound are
# scope selectors ("all" | "workspace" | "transitive" | "none"); "all" checks
# every crate in the graph and reports them as warnings.
unmaintained = "all"
yanked = "warn"
# Canonical source of truth for advisory ignores. `.cargo/audit.toml` is
# derived from this list via `jci-audit sync`. Each entry needs a written
# justification, and `jci-audit prune` reports any entry that no longer fires.
#
# Empty, and worth keeping that way. RUSTSEC-2023-0071 (`rsa`, Marvin Attack)
# used to sit here: it arrived through pcu's OIDC/attestation surface, which
# could not be excluded because pcu had no feature gates. jerus-org/pcu#1028
# added them, and taking pcu with `default-features = false` removes `rsa`,
# `openidconnect` and `sigstore` from the graph outright. RUSTSEC-2026-0253
# (`lru`) followed the same pattern: it arrived via pcu's bsky surface
# (bsky-sdk -> atrium), and jerus-org/pcu#1035 gated that behind the same
# flag.
#
# Not suppressing an advisory beats justifying it. An ignore says the risk was
# reasoned about; an absent dependency says there is nothing to reason about.
ignore = []

[licenses]
# All licenses are denied unless explicitly allowed. Permissive licenses are
# allowed globally; weak-copyleft licenses are NOT — they are scoped to the
# specific transitive crates that carry them via [[licenses.exceptions]], so a
# new copyleft dependency fails the check until consciously reviewed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

# Weak-copyleft licences are NOT allowed globally: each is scoped to the specific
# crate that carries it, so a NEW copyleft dependency fails the check until it has
# been consciously reviewed. Remove an exception as soon as its dependency leaves
# the graph — an exception nobody can account for is one nobody will question later.

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
