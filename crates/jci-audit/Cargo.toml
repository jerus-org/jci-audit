[package]
name = "jci-audit"
version = "0.0.6"
description = "Context-aware Rust security gate orchestrating cargo-audit and cargo-deny with reproducible release-time validation"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# cargo-about tooling config: needed to regenerate THIRD-PARTY-LICENSES.md but
# not part of the distributed crate.
exclude = ["about.toml", "about.hbs"]

# jci-audit orchestrates the `cargo audit` and `cargo deny` *binaries* as
# subprocesses — it does not link them as library crates. They are runtime
# prerequisites (shipped by the `jerusdp/ci-rust:audit` executor image), and
# the CLI's preflight check reports their absence rather than failing opaquely.

[dependencies]
# CLI
clap.workspace = true
clap-verbosity-flag.workspace = true

# Error Handling
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true

# TOML parsing/editing: read deny.toml [advisories].ignore, render audit.toml
toml_edit.workspace = true

# JSON parsing: cargo-audit --json reports (prune), release record (release)
serde_json.workspace = true

# Hashing: records which Cargo.lock a release was validated against
sha2.workspace = true

# Signed commit + App-authenticated push of the release record
pcu.workspace = true
tokio.workspace = true
config.workspace = true

# NOTE: config, serde, thiserror are declared in the workspace dependency
# catalog and switched on when a phase needs them.

[dev-dependencies]
tempfile.workspace = true
trycmd.workspace = true

[[bin]]
name = "jci-audit"
path = "src/main.rs"

[lib]
name = "jci_audit"
path = "src/lib.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/jci-audit-v{ version }/jci-audit-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

# cargo-binstall signature verification. The pubkey is a placeholder in source:
# the release pipeline generates an ephemeral minisign/rsign keypair, signs the
# tarball, and `pcu release inject-pubkey` replaces the `pubkey` value below with
# that release's public key before the crate is published. Without this section
# pcu has nothing to replace and the signature is published unverifiable.
[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWQFM/+9Uou/15oC3CYUVLSvza0vcLVVEoLgJvVdfQppOhhDXRaVusHp"
