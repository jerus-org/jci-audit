[package]
name = "jci-audit"
version = "0.0.7"
description = "Context-aware Rust security gate orchestrating cargo-audit and cargo-deny with reproducible release-time validation"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# cargo-about tooling config: needed to regenerate THIRD-PARTY-LICENSES.md but
# not part of the distributed crate.
exclude = ["about.toml", "about.hbs"]
# Bin-only, deliberately: nothing in this org depends on `jci_audit` as a
# library (see jerus-org/jci-audit#90), so publishing must not make one
# resolvable. Explicit rather than relying only on the absence of
# `src/lib.rs`, so a future `src/lib.rs` doesn't silently resurrect one.
autolib = false

# jci-audit orchestrates the `cargo audit` and `cargo deny` *binaries* as
# subprocesses — it does not link them as library crates. They are runtime
# prerequisites (shipped by the `jerusdp/ci-rust:audit` executor image), and
# the CLI's preflight check reports their absence rather than failing opaquely.

[dependencies]
# CLI
clap.workspace = true
clap-verbosity-flag.workspace = true

# Error Handling
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true

# TOML parsing/editing: read deny.toml [advisories].ignore, render audit.toml
toml_edit.workspace = true

# JSON parsing: cargo-audit --json reports (prune), release record (release)
serde_json.workspace = true

# Hashing: records which Cargo.lock a release was validated against
sha2.workspace = true

# SPDX license expression evaluation: which deny.toml-allowed identifier
# satisfies a dependency's (possibly compound) declared license, per crate
spdx.workspace = true

# Release-record remote fetch (verify's no-local-checkout path, #75 phase 3):
# downloads the record + signature from a published GitHub release, and the
# release tag's raw Cargo.toml for the historical signing pubkey.
pcu-release-assets.workspace = true
tokio.workspace = true
reqwest.workspace = true

# NOTE: config, serde, thiserror are declared in the workspace dependency
# catalog and switched on when a phase needs them — `config` is reserved for
# a future `jci-audit.toml` config file, not yet built.

[dev-dependencies]
tempfile.workspace = true
trycmd.workspace = true

[[bin]]
name = "jci-audit"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/jci-audit-v{ version }/jci-audit-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

# cargo-binstall signature verification. The pubkey is a placeholder in source:
# the release pipeline generates an ephemeral minisign/rsign keypair, signs the
# tarball, and `pcu release inject-pubkey` replaces the `pubkey` value below with
# that release's public key before the crate is published. Without this section
# pcu has nothing to replace and the signature is published unverifiable.
[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWSImK6yfWBJsXrcL0Pj4rGeuKAZBAHz1LtaE677qZGJ4Pd/O+L2A9vl"
