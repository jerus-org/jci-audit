# cargo-about configuration for generating THIRD-PARTY-LICENSES.md.
#
# The `accepted` lists below (top-level and per-crate) are DERIVED from the
# canonical ../../deny.toml [licenses] policy by `jci-audit sync`, scoped down
# to the licenses this crate's own dependency graph actually carries — not a
# copy of deny.toml's full workspace-wide allow list. `jci-audit sync --check`
# fails on drift without writing. Adding a new exception is still the same
# conscious review as adding a [[licenses.exceptions]] entry to deny.toml
# (scoping matters — a global accept list would take a NEW copyleft dependency
# in silence); `sync` just keeps this file in step with that decision instead
# of requiring it done by hand in two places. Everything else in this file —
# this comment, `ignore-dev-dependencies`, and the `.clarify` pins below — is
# hand-authored and untouched by `sync`.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

# Notices cover what ships in the binary: dev-only dependencies (test harness,
# etc.) are not distributed, so they are excluded.
ignore-dev-dependencies = true
