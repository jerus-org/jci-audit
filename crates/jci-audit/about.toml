# cargo-about configuration for generating THIRD-PARTY-LICENSES.md.
#
# Mirrors the license policy in deny.toml, including its structure: permissive
# licenses are accepted globally, and each weak-copyleft license is scoped to the
# one crate that carries it. Scoping matters — a global accept list would take a
# NEW copyleft dependency in silence, which is the case worth catching. Adding a
# crate here is the same conscious review as adding a [[licenses.exceptions]]
# entry to deny.toml, and the two must be kept in step.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

# Notices cover what ships in the binary: dev-only dependencies (test harness,
# etc.) are not distributed, so they are excluded.
ignore-dev-dependencies = true

# The weak-copyleft crates, matching deny.toml's [[licenses.exceptions]] one for
# one. The LGPL-2.0-or-later pair went with pcu's OpenPGP stack at 0.6.30 and was
# removed from both files together — they state one policy, so they go stale
# together too.

# MPL-2.0 (file-level copyleft): transitive config/dirs helper.
[option-ext]
accepted = ["MPL-2.0"]

# Pin the attribution for the two crates that vendor C libraries.
#
# Both declare "MIT OR Apache-2.0" and ship the correct text at their crate root,
# but they also vendor upstream sources carrying license files of their own —
# libgit2 and its bundled deps, libssh2. Left to discovery, cargo-about can reach
# a nested file instead of the crate root and attribute the crate to the wrong
# party entirely: libgit2-sys to llhttp's author via
# `libgit2/deps/llhttp/LICENSE-MIT`, and libssh2-sys to an unfilled SPDX template
# in `libssh2/LICENSES/MIT.txt` that reads "Copyright (c) [year] [fullname]" —
# an attribution naming nobody.
#
# Which file wins varied between this workstation and the release container on
# identical inputs and the same cargo-about version, so the notices were not
# reproducible. Naming the file settles it. `checksum` makes the pin fail loudly
# if the file changes rather than silently attributing to something else.
#
# Taken under MIT — one arm of the OR, which is the choice these notices publish.

[libgit2-sys.clarify]
license = "MIT"
[[libgit2-sys.clarify.files]]
path = "LICENSE-MIT"
checksum = "378f5840b258e2779c39418f3f2d7b2ba96f1c7917dd6be0713f88305dbda397"

[libssh2-sys.clarify]
license = "MIT"
[[libssh2-sys.clarify.files]]
path = "LICENSE-MIT"
checksum = "378f5840b258e2779c39418f3f2d7b2ba96f1c7917dd6be0713f88305dbda397"
