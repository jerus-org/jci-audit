# cargo-about configuration for generating THIRD-PARTY-LICENSES.md.
# The accepted list mirrors the license policy in deny.toml: jci-audit's
# dependency graph is permissive-only (no OpenPGP/GPG-signing stack), so unlike
# gen-circleci-orb it needs no LGPL-2.0-or-later / MPL-2.0 exceptions. Keep this
# list in sync with deny.toml's [licenses].allow.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

# Notices cover what ships in the binary: dev-only dependencies (test harness,
# etc.) are not distributed, so they are excluded.
ignore-dev-dependencies = true
