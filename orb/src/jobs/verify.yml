description: Run verify command in a dedicated job.
executor: default
parameters:
  release_version:
    type: string
    description: The released version to verify (e.g. "1.2.0")
  advisory_db:
    type: string
    description: Advisory-db root; the checkout is moved to the recorded commit. Defaults to ~/.cargo/advisory-db.
    default: ''
  owner:
    type: string
    description: GitHub repository owner that published the release (e.g. "jerus-org"). Needed to fetch the release when no local record is found.
    default: ''
  repo:
    type: string
    description: GitHub repository name that published the release (e.g. "jci-audit"). Needed to fetch the release when no local record is found.
    default: ''
  tag_prefix:
    type: string
    description: Release tag prefix (e.g. "jci-audit-v"); combined with --release-version to form the tag to fetch when no local record is found
    default: ''
  deny_warnings:
    type: boolean
    description: Fail if the tools report any warning
    default: false
  verbose:
    type: boolean
    description: Increase logging verbosity
    default: false
  quiet:
    type: boolean
    description: Decrease logging verbosity
    default: false
  attach_workspace:
    type: boolean
    description: Attach a workspace before running the command (use when the binary was built in a prior job).
    default: false
  workspace_root:
    type: string
    description: Path at which to attach the workspace; also prepended to PATH (only used when attach_workspace is true).
    default: /tmp/workspace
steps:
- checkout
- when:
    condition: << parameters.attach_workspace >>
    steps:
    - attach_workspace:
        at: << parameters.workspace_root >>
    - run:
        name: Add workspace binaries to PATH
        command: <<include(scripts/add-workspace-to-path.sh)>>
        environment:
          WORKSPACE_ROOT: << parameters.workspace_root >>
- verify:
    release_version: << parameters.release_version >>
    advisory_db: << parameters.advisory_db >>
    owner: << parameters.owner >>
    repo: << parameters.repo >>
    tag_prefix: << parameters.tag_prefix >>
    deny_warnings: << parameters.deny_warnings >>
    verbose: << parameters.verbose >>
    quiet: << parameters.quiet >>
