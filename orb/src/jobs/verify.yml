description: Run verify command in a dedicated job.
executor: default
parameters:
  release_version:
    type: string
    description: The released version to verify (e.g. "1.2.0")
  verbose:
    type: boolean
    description: Increase logging verbosity
    default: false
  advisory_db:
    type: string
    description: Advisory-db root; cargo-deny's checkout is moved to the recorded commit beneath it. Defaults to ~/.cargo/advisory-db
    default: ''
  quiet:
    type: boolean
    description: Decrease logging verbosity
    default: false
  deny_warnings:
    type: boolean
    description: Fail if the tools report any warning
    default: false
  attach_workspace:
    type: boolean
    description: Attach a workspace before running the command (use when the binary was built in a prior job).
    default: false
  workspace_root:
    type: string
    description: Path at which to attach the workspace; also prepended to PATH (only used when attach_workspace is true).
    default: /tmp/workspace
steps:
- checkout
- when:
    condition: << parameters.attach_workspace >>
    steps:
    - attach_workspace:
        at: << parameters.workspace_root >>
    - run:
        name: Add workspace binaries to PATH
        command: <<include(scripts/add-workspace-to-path.sh)>>
        environment:
          WORKSPACE_ROOT: << parameters.workspace_root >>
- verify:
    release_version: << parameters.release_version >>
    verbose: << parameters.verbose >>
    advisory_db: << parameters.advisory_db >>
    quiet: << parameters.quiet >>
    deny_warnings: << parameters.deny_warnings >>
