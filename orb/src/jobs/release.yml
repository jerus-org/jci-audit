description: Run release command in a dedicated job.
executor: default
parameters:
  version:
    type: string
    description: The release version being validated (e.g. "1.2.0")
  advisory_db:
    type: string
    description: Path to a checked-out advisory-db at the pinned commit. When omitted, the pinned commit is resolved from configuration
    default: ''
  commit:
    type: boolean
    description: 'Commit the record. Required when the release pipeline runs cargo-release afterwards: cargo-release refuses to start on a dirty tree, so the record must already be committed'
    default: false
  push:
    type: boolean
    description: Push the commit using the credentials the CI checkout provided. Nothing here carries credentials of its own
    default: false
  gpg_key_env:
    type: string
    description: Env var NAME holding the base64 GPG signing key (default GPG_KEY)
    default: ''
  gpg_trust_env:
    type: string
    description: Env var NAME holding the GPG ownertrust (default GPG_TRUST)
    default: ''
  user_name_env:
    type: string
    description: Env var NAME holding the committer name (default GIT_USER_NAME)
    default: ''
  user_email_env:
    type: string
    description: Env var NAME holding the committer email (default GIT_USER_EMAIL)
    default: ''
  sign_key_env:
    type: string
    description: Env var NAME holding the GPG signing key id (default GPG_SIGN_KEY)
    default: ''
  attach_workspace:
    type: boolean
    description: Attach a workspace before running the command (use when the binary was built in a prior job).
    default: false
  workspace_root:
    type: string
    description: Path at which to attach the workspace; also prepended to PATH (only used when attach_workspace is true).
    default: /tmp/workspace
steps:
- checkout
- when:
    condition: << parameters.attach_workspace >>
    steps:
    - attach_workspace:
        at: << parameters.workspace_root >>
    - run:
        name: Add workspace binaries to PATH
        command: <<include(scripts/add-workspace-to-path.sh)>>
        environment:
          WORKSPACE_ROOT: << parameters.workspace_root >>
- release:
    version: << parameters.version >>
    advisory_db: << parameters.advisory_db >>
    commit: << parameters.commit >>
    push: << parameters.push >>
    gpg_key_env: << parameters.gpg_key_env >>
    gpg_trust_env: << parameters.gpg_trust_env >>
    user_name_env: << parameters.user_name_env >>
    user_email_env: << parameters.user_email_env >>
    sign_key_env: << parameters.sign_key_env >>
