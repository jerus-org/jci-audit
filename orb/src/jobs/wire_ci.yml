description: Run wire-ci command in a dedicated job.
executor: default
parameters:
  verbose:
    type: boolean
    description: Increase logging verbosity
    default: false
  quiet:
    type: boolean
    description: Decrease logging verbosity
    default: false
  config:
    type: string
    description: Path to the `CircleCI` config file to patch. Defaults to `.circleci/config.yml` relative to the nearest deny.toml above the current directory — the same discovery convention `publish-record --record-path`'s own default uses — rather than the current directory itself, so this command behaves the same whether run from the workspace root or a crate subdirectory. An explicit value here is used as given.
    default: ''
  orb_job:
    type: string
    description: The orb job to wire in, e.g. "jci-audit/check"
    default: ''
  orb_version:
    type: string
    description: The orb version pin, e.g. "jerus-org/jci-audit@1.0". Only applied when the orb isn't already pinned — re-running with a bumped version does not resync an existing pin
    default: ''
  workflow:
    type: string
    description: The workflow to wire the job into, e.g. "validation". Must already exist in the target config file — this command wires into an existing workflow, it does not scaffold one
    default: ''
  job_name:
    type: string
    description: Optional `name:` param for the new job entry
    default: ''
  clear_requires:
    type: boolean
    description: Clear the configured `requires:` list instead of leaving it unchanged (a bare `--requires` cannot express "clear the list" on its own — a repeatable flag given zero times just means "not given")
    default: false
  required_by:
    type: string
    description: 'Existing jobs in the same workflow whose own `requires:` should gain this new job. Matched by effective name: a target''s own `name:` override if it declares one, else its bare job/orb-job string — exact, case-sensitive. Each target must already have a `requires:` key in a plain inline (`requires: [a, b]`) or block list form; jci-audit never invents one on a job it doesn''t own — add it by hand first. Repeatable; any use replaces the configured list outright'
    default: ''
  clear_required_by:
    type: boolean
    description: Clear the configured `required_by:` list instead of leaving it unchanged (see `--clear-requires`)
    default: false
  check:
    type: boolean
    description: Fail (non-zero) on drift instead of writing either file. For CI
    default: false
  attach_workspace:
    type: boolean
    description: Attach a workspace before running the command (use when the binary was built in a prior job).
    default: false
  workspace_root:
    type: string
    description: Path at which to attach the workspace; also prepended to PATH (only used when attach_workspace is true).
    default: /tmp/workspace
steps:
- checkout
- when:
    condition: << parameters.attach_workspace >>
    steps:
    - attach_workspace:
        at: << parameters.workspace_root >>
    - run:
        name: Add workspace binaries to PATH
        command: <<include(scripts/add-workspace-to-path.sh)>>
        environment:
          WORKSPACE_ROOT: << parameters.workspace_root >>
- wire_ci:
    verbose: << parameters.verbose >>
    quiet: << parameters.quiet >>
    config: << parameters.config >>
    orb_job: << parameters.orb_job >>
    orb_version: << parameters.orb_version >>
    workflow: << parameters.workflow >>
    job_name: << parameters.job_name >>
    clear_requires: << parameters.clear_requires >>
    required_by: << parameters.required_by >>
    clear_required_by: << parameters.clear_required_by >>
    check: << parameters.check >>
