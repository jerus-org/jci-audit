description: Run release-prep command in a dedicated job.
executor: default
parameters:
  version:
    type: string
    description: The release version being validated (e.g. "1.2.0")
    default: ''
  log_level:
    type: enum
    description: 'Logging verbosity: consolidates this tool''s clap-verbosity-flag -q/--quiet and -v/--verbose repeat-counters (its own linked pair) into one selector, so they can''t be set independently and cancel out. clap-verbosity-flag escalates off -> error -> warn -> info -> debug -> trace, typically starting at error: `quiet` is a single -q (one step quieter); `default` is this tool''s own starting point on that scale; `v` / `vv` / `vvv` / `vvvv` are -v / -vv / -vvv / -vvvv (one to four steps louder).'
    default: default
    enum:
    - quiet
    - default
    - v
    - vv
    - vvv
    - vvvv
  advisory_db:
    type: string
    description: Advisory-db root; cargo-deny's checkout lives beneath it. Its commit becomes the pin. Defaults to ~/.cargo/advisory-db.
    default: ''
  package:
    type: string
    description: The crate's package name (its `[package].name` in Cargo.toml, e.g. "jci-audit") — cargo's own `-p`/`--package` convention. Resolved from the workspace's own `cargo metadata`, not a raw path. Scopes the dependency digest and the record's own path (`.security/<package>-release-<VERSION>.json`) to just this crate's reachable dependency graph, for this org's per-crate multi-crate release sequence (garden-level CLAUDE.md). The advisory policy gate (deny.toml, cargo-deny) stays workspace-wide either way. Omit for a single-crate workspace's whole-graph record (unchanged behaviour).
    default: ''
  deny_warnings:
    type: boolean
    description: Fail if the tools report any warning
    default: false
  attach_workspace:
    type: boolean
    description: Attach a workspace before running the command (use when the binary was built in a prior job).
    default: false
  workspace_root:
    type: string
    description: Path at which to attach the workspace; also prepended to PATH (only used when attach_workspace is true).
    default: /tmp/workspace
  version_env_var:
    type: string
    description: Name of the variable inside <workspace_root>/versions.env-shaped source file holding version's real value (e.g. "CRATE_VERSION_MYAPP", as written by circleci-toolkit's calculate_versions). Leave empty (default) to use the version parameter's own literal value instead. Requires attach_workspace.
    default: ''
  version_source_file:
    type: string
    description: Path to the env-style file to resolve version_env_var from. Empty (default) resolves to '<workspace_root>/versions.env' — calculate_versions' own output path. Only used when version_env_var is set.
    default: ''
steps:
- checkout
- when:
    condition: << parameters.attach_workspace >>
    steps:
    - attach_workspace:
        at: << parameters.workspace_root >>
    - run:
        name: Add workspace binaries to PATH
        command: <<include(scripts/add-workspace-to-path.sh)>>
        environment:
          WORKSPACE_ROOT: << parameters.workspace_root >>
- when:
    condition: << parameters.version_env_var >>
    steps:
    - run:
        name: Resolve version from attached workspace
        command: <<include(scripts/resolve_workspace_param.sh)>>
        environment:
          GCO_TARGET_ENV_VAR: << parameters.version_env_var >>
          GCO_SOURCE_FILE: << parameters.version_source_file >>
          GCO_WORKSPACE_ROOT: << parameters.workspace_root >>
          GCO_OVERRIDE_VAR: GCO_VERSION_RESOLVED
- release_prep:
    version: << parameters.version >>
    log_level: << parameters.log_level >>
    advisory_db: << parameters.advisory_db >>
    package: << parameters.package >>
    deny_warnings: << parameters.deny_warnings >>
