description: Run prune command in a dedicated job.
executor: default
parameters:
  check:
    type: boolean
    description: Fail (non-zero) when a stale ignore is found. For CI
    default: false
  verbose:
    type: boolean
    description: '...  Increase logging verbosity'
    default: false
  quiet:
    type: boolean
    description: '...    Decrease logging verbosity'
    default: false
  attach_workspace:
    type: boolean
    description: Attach a workspace before running the command (use when the binary was built in a prior job).
    default: false
  workspace_root:
    type: string
    description: Path at which to attach the workspace; also prepended to PATH (only used when attach_workspace is true).
    default: /tmp/workspace
steps:
- checkout
- when:
    condition: << parameters.attach_workspace >>
    steps:
    - attach_workspace:
        at: << parameters.workspace_root >>
    - run:
        name: Add workspace binaries to PATH
        command: <<include(scripts/add-workspace-to-path.sh)>>
        environment:
          WORKSPACE_ROOT: << parameters.workspace_root >>
- prune:
    check: << parameters.check >>
    verbose: << parameters.verbose >>
    quiet: << parameters.quiet >>
