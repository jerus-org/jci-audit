description: Run publish-record command in a dedicated job.
executor: default
parameters:
  version:
    type: string
    description: The release version whose record to publish (e.g. "1.2.0"). Falls back to an environment variable when omitted, matching release-prep.
    default: ''
  verbose:
    type: boolean
    description: Increase logging verbosity
    default: false
  quiet:
    type: boolean
    description: Decrease logging verbosity
    default: false
  tag:
    type: string
    description: The exact release tag to attach assets to (e.g. "myapp-v1.2.0")
  owner:
    type: string
    description: GitHub repository owner that owns the release
  repo:
    type: string
    description: GitHub repository name that owns the release
  publish:
    type: boolean
    description: Un-draft the release once the assets are attached
    default: false
  record_path:
    type: string
    description: Where to find the record to sign and upload. Defaults to `.security/release-<VERSION>.json` relative to the nearest deny.toml above the current directory — the same discovery `verify` uses. Override when release-prep and this command run in different jobs and the record arrives via an attached workspace instead, e.g. `${WORKSPACE_ROOT}/.security/release-<VERSION>.json`.
    default: ''
  attach_workspace:
    type: boolean
    description: Attach a workspace before running the command (use when the binary was built in a prior job).
    default: false
  workspace_root:
    type: string
    description: Path at which to attach the workspace; also prepended to PATH (only used when attach_workspace is true).
    default: /tmp/workspace
steps:
- checkout
- when:
    condition: << parameters.attach_workspace >>
    steps:
    - attach_workspace:
        at: << parameters.workspace_root >>
    - run:
        name: Add workspace binaries to PATH
        command: <<include(scripts/add-workspace-to-path.sh)>>
        environment:
          WORKSPACE_ROOT: << parameters.workspace_root >>
- publish_record:
    version: << parameters.version >>
    verbose: << parameters.verbose >>
    quiet: << parameters.quiet >>
    tag: << parameters.tag >>
    owner: << parameters.owner >>
    repo: << parameters.repo >>
    publish: << parameters.publish >>
    record_path: << parameters.record_path >>
