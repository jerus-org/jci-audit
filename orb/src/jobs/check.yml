description: Run check command in a dedicated job.
executor: default
parameters:
  verbose:
    type: boolean
    description: Increase logging verbosity
    default: false
  quiet:
    type: boolean
    description: Decrease logging verbosity
    default: false
  manifest_path:
    type: string
    description: Path to the Cargo.toml (or its directory) to check
    default: .
  deny_stale_exceptions:
    type: boolean
    description: Fail if a configured [[bans.skip]] exception no longer fires. cargo-deny already reports this as `warning[unmatched-skip]` (surfaced via --deny-warnings too, along with every other warning) — this is the same check narrowed to just stale exceptions, so a repo can require deny.toml cleanup without also failing on unrelated warnings. Mirrors `prune --check`.
    default: false
  deny_warnings:
    type: boolean
    description: Fail if the tools report any warning
    default: false
  attach_workspace:
    type: boolean
    description: Attach a workspace before running the command (use when the binary was built in a prior job).
    default: false
  workspace_root:
    type: string
    description: Path at which to attach the workspace; also prepended to PATH (only used when attach_workspace is true).
    default: /tmp/workspace
steps:
- checkout
- when:
    condition: << parameters.attach_workspace >>
    steps:
    - attach_workspace:
        at: << parameters.workspace_root >>
    - run:
        name: Add workspace binaries to PATH
        command: <<include(scripts/add-workspace-to-path.sh)>>
        environment:
          WORKSPACE_ROOT: << parameters.workspace_root >>
- check:
    verbose: << parameters.verbose >>
    quiet: << parameters.quiet >>
    manifest_path: << parameters.manifest_path >>
    deny_stale_exceptions: << parameters.deny_stale_exceptions >>
    deny_warnings: << parameters.deny_warnings >>
