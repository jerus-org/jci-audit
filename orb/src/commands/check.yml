description: 'PR / dev gate: run cargo-deny policy checks AND a live cargo-audit scan; both blocking. Aggregates exit codes and surfaces stderr'
parameters:
  manifest_path:
    type: string
    description: Path to the Cargo.toml (or its directory) to check
    default: .
  verbose:
    type: boolean
    description: '...                     Increase logging verbosity --deny-warnings                  Fail if the tools report any warning'
    default: false
  quiet:
    type: boolean
    description: '...                       Decrease logging verbosity'
    default: false
steps:
- when:
    condition: << parameters.verbose >>
    steps:
    - run:
        name: Set VERBOSE flag
        command: echo 'export VERBOSE=true' >> "$BASH_ENV"
- when:
    condition: << parameters.quiet >>
    steps:
    - run:
        name: Set QUIET flag
        command: echo 'export QUIET=true' >> "$BASH_ENV"
- run:
    name: 'PR / dev gate: run cargo-deny policy checks AND a live cargo-audit scan; both blocking. Aggregates exit codes and surfaces stderr'
    command: <<include(scripts/check.sh)>>
    environment:
      MANIFEST_PATH: << parameters.manifest_path >>
