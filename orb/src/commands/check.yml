description: 'PR/dev gate: cargo-deny policy, a live cargo-audit scan, and license policy. All four blocking: cargo-deny, cargo-audit, the about.toml/deny.toml drift check, and the cargo-about resolution check. Aggregates exit codes and surfaces stderr.'
parameters:
  log_level:
    type: enum
    description: 'Logging verbosity: consolidates this tool''s clap-verbosity-flag -q/--quiet and -v/--verbose repeat-counters (its own linked pair) into one selector, so they can''t be set independently and cancel out. clap-verbosity-flag escalates off -> error -> warn -> info -> debug -> trace, typically starting at error: `quiet` is a single -q (one step quieter); `default` is this tool''s own starting point on that scale; `v` / `vv` / `vvv` / `vvvv` are -v / -vv / -vvv / -vvvv (one to four steps louder).'
    default: default
    enum:
    - quiet
    - default
    - v
    - vv
    - vvv
    - vvvv
  manifest_path:
    type: string
    description: Path to the Cargo.toml (or its directory) to check
    default: .
  deny_stale_exceptions:
    type: boolean
    description: Fail if a configured [[bans.skip]] exception no longer fires. cargo-deny already reports this as `warning[unmatched-skip]` or `warning[unnecessary-skip]` (surfaced via --deny-warnings too, along with every other warning) — this is the same check narrowed to just stale exceptions, so a repo can require deny.toml cleanup without also failing on unrelated warnings. Mirrors `prune --check`.
    default: false
  deny_unused_licenses:
    type: boolean
    description: Fail if deny.toml allows a license nothing in the graph uses. cargo-deny already reports this as `warning[license-not-encountered]` (surfaced via --deny-warnings too, along with every other warning) — this is the same check narrowed to just unused allowances, so a repo can require deny.toml cleanup without also failing on unrelated warnings. Unlike a duplicate crate, an unused allowance is never a legitimately-unfixable condition worth accepting — it's always just stale config, so there is no exception mechanism to pair this with.
    default: false
  deny_warnings:
    type: boolean
    description: Fail if the tools report any warning
    default: false
steps:
- when:
    condition: << parameters.deny_stale_exceptions >>
    steps:
    - run:
        name: Set DENY_STALE_EXCEPTIONS flag
        command: echo 'export DENY_STALE_EXCEPTIONS=true' >> "$BASH_ENV"
- when:
    condition: << parameters.deny_unused_licenses >>
    steps:
    - run:
        name: Set DENY_UNUSED_LICENSES flag
        command: echo 'export DENY_UNUSED_LICENSES=true' >> "$BASH_ENV"
- when:
    condition: << parameters.deny_warnings >>
    steps:
    - run:
        name: Set DENY_WARNINGS flag
        command: echo 'export DENY_WARNINGS=true' >> "$BASH_ENV"
- run:
    name: 'PR/dev gate: cargo-deny policy, a live cargo-audit scan, and license policy.'
    command: <<include(scripts/check.sh)>>
    environment:
      LOG_LEVEL: << parameters.log_level >>
      MANIFEST_PATH: << parameters.manifest_path >>
