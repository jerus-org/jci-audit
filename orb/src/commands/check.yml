description: 'PR/dev gate: cargo-deny policy, a live cargo-audit scan, and license policy. All four blocking: cargo-deny, cargo-audit, the about.toml/deny.toml drift check, and the cargo-about resolution check. Aggregates exit codes and surfaces stderr.'
parameters:
  verbose:
    type: boolean
    description: Increase logging verbosity
    default: false
  quiet:
    type: boolean
    description: Decrease logging verbosity
    default: false
  manifest_path:
    type: string
    description: Path to the Cargo.toml (or its directory) to check
    default: .
  deny_stale_exceptions:
    type: boolean
    description: Fail if a configured [[bans.skip]] exception no longer fires. cargo-deny already reports this as `warning[unmatched-skip]` (surfaced via --deny-warnings too, along with every other warning) — this is the same check narrowed to just stale exceptions, so a repo can require deny.toml cleanup without also failing on unrelated warnings. Mirrors `prune --check`.
    default: false
  deny_warnings:
    type: boolean
    description: Fail if the tools report any warning
    default: false
steps:
- when:
    condition: << parameters.verbose >>
    steps:
    - run:
        name: Set VERBOSE flag
        command: echo 'export VERBOSE=true' >> "$BASH_ENV"
- when:
    condition: << parameters.quiet >>
    steps:
    - run:
        name: Set QUIET flag
        command: echo 'export QUIET=true' >> "$BASH_ENV"
- when:
    condition: << parameters.deny_stale_exceptions >>
    steps:
    - run:
        name: Set DENY_STALE_EXCEPTIONS flag
        command: echo 'export DENY_STALE_EXCEPTIONS=true' >> "$BASH_ENV"
- when:
    condition: << parameters.deny_warnings >>
    steps:
    - run:
        name: Set DENY_WARNINGS flag
        command: echo 'export DENY_WARNINGS=true' >> "$BASH_ENV"
- run:
    name: 'PR/dev gate: cargo-deny policy, a live cargo-audit scan, and license policy.'
    command: <<include(scripts/check.sh)>>
    environment:
      MANIFEST_PATH: << parameters.manifest_path >>
