description: 'Release gate: reproducible validation against a pinned advisory-db commit (cargo-deny offline), then a non-blocking live cargo-audit. Writes the record locally to `.security/release-<VERSION>.json`; see jerus-org/jci-audit#75 for how it is distributed from there'
parameters:
  release_version:
    type: string
    description: The release version being validated (e.g. "1.2.0"). Falls back to an environment variable when omitted, since release pipelines compute the version at runtime (see the other version flag below)
    default: ''
  verbose:
    type: boolean
    description: Increase logging verbosity
    default: false
  quiet:
    type: boolean
    description: Decrease logging verbosity
    default: false
  advisory_db:
    type: string
    description: Advisory-db root; cargo-deny's checkout is discovered/refreshed beneath it and its commit becomes the pin. Defaults to ~/.cargo/advisory-db
    default: ''
  deny_warnings:
    type: boolean
    description: Fail if the tools report any warning
    default: false
steps:
- when:
    condition: << parameters.verbose >>
    steps:
    - run:
        name: Set VERBOSE flag
        command: echo 'export VERBOSE=true' >> "$BASH_ENV"
- when:
    condition: << parameters.quiet >>
    steps:
    - run:
        name: Set QUIET flag
        command: echo 'export QUIET=true' >> "$BASH_ENV"
- when:
    condition: << parameters.deny_warnings >>
    steps:
    - run:
        name: Set DENY_WARNINGS flag
        command: echo 'export DENY_WARNINGS=true' >> "$BASH_ENV"
- run:
    name: 'Release gate: reproducible validation against a pinned advisory-db commit (cargo-deny offline), then a non-blocking live cargo-audit. Writes the record locally to `.security/release-<VERSION>.json`; see jerus-org/jci-audit#75 for how it is distributed from there'
    command: <<include(scripts/release.sh)>>
    environment:
      RELEASE_VERSION: << parameters.release_version >>
      ADVISORY_DB: << parameters.advisory_db >>
