description: 'Release gate: reproducible validation against a pinned advisory-db commit (deny + audit offline), then a non-blocking live audit. Records the run to `.security/release-<VERSION>.json`'
parameters:
  verbose:
    type: boolean
    description: '... Increase logging verbosity --version <VERSION> The release version being validated (e.g. "1.2.0"). When omitted it is read from the environment variable named by --version-env, since release pipelines compute the version at runtime'
    default: false
  quiet:
    type: boolean
    description: '... Decrease logging verbosity --version-env <VERSION_ENV> Env var NAME holding the release version when --version is not given (default SEMVER) --advisory-db <ADVISORY_DB> Path to a checked-out advisory-db at the pinned commit. When omitted, the pinned commit is resolved from configuration --commit Commit the record. Required when the release pipeline runs cargo-release afterwards: cargo-release refuses to start on a dirty tree, so the record must already be committed --push Push the commit. A protected branch accepts only a credential its rules permit to bypass them, so supply PCU_APP_ID and PCU_PRIVATE_KEY for a GitHub App token; a deploy key cannot bypass, whatever write access it carries --gpg-key-env <GPG_KEY_ENV> Env var NAME holding the base64 GPG signing key (default GPG_KEY) --gpg-trust-env <GPG_TRUST_ENV> Env var NAME holding the GPG ownertrust (default GPG_TRUST) --user-name-env <USER_NAME_ENV> Env var NAME holding the committer name (default GIT_USER_NAME) --user-email-env <USER_EMAIL_ENV> Env var NAME holding the committer email (default GIT_USER_EMAIL) --sign-key-env <SIGN_KEY_ENV> Env var NAME holding the GPG signing key id (default GPG_SIGN_KEY) --deny-warnings Fail if the tools report any warning'
    default: false
steps:
- when:
    condition: << parameters.verbose >>
    steps:
    - run:
        name: Set VERBOSE flag
        command: echo 'export VERBOSE=true' >> "$BASH_ENV"
- when:
    condition: << parameters.quiet >>
    steps:
    - run:
        name: Set QUIET flag
        command: echo 'export QUIET=true' >> "$BASH_ENV"
- run:
    name: 'Release gate: reproducible validation against a pinned advisory-db commit (deny + audit offline), then a non-blocking live audit. Records the run to `.security/release-<VERSION>.json`'
    command: <<include(scripts/release.sh)>>
