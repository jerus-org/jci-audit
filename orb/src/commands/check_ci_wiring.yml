description: 'Check that the `CircleCI` config matches `jci-audit.toml`''s `[ci]` wiring spec, without writing. The CI-facing counterpart to `wire-ci`: fails (non-zero) on drift, or if `[[ci.jobs]]` isn''t configured yet, and never writes either file. This is a separate subcommand rather than a `--check` flag on `wire-ci` because a CI job must never be able to rewrite the `CircleCI` config that is currently running it — holds by construction: `check-ci-wiring`''s CLI surface has no flag that could make it write, so the orb job the generator produces for it can''t be wired into a workflow in a way that regresses to write mode.'
parameters:
  log_level:
    type: enum
    description: Logging verbosity, relative to this tool's own default level (quiet, default, verbose, verbose2, verbose3, verbose4).
    default: default
    enum:
    - quiet
    - default
    - verbose
    - verbose2
    - verbose3
    - verbose4
  config:
    type: string
    description: Path to the jci-audit.toml-shaped wiring spec to read. Same resolution rules as `wire-ci --config`
    default: ''
steps:
- run:
    name: Check that the `CircleCI` config matches `jci-audit.toml`'s `[ci]` wiring spec, without writing.
    command: <<include(scripts/check_ci_wiring.sh)>>
    environment:
      LOG_LEVEL: << parameters.log_level >>
      CONFIG: << parameters.config >>
