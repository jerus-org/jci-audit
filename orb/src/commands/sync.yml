description: Derive `.cargo/audit.toml` from the canonical `deny.toml`. Reads `[advisories].ignore`, keeping deny.toml the single source of truth.
parameters:
  check:
    type: boolean
    description: Fail (non-zero) on drift instead of rewriting the file. For CI
    default: false
  log_level:
    type: enum
    description: Logging verbosity, relative to this tool's own default level (quiet, default, verbose, verbose2, verbose3, verbose4).
    default: default
    enum:
    - quiet
    - default
    - verbose
    - verbose2
    - verbose3
    - verbose4
steps:
- when:
    condition: << parameters.check >>
    steps:
    - run:
        name: Set CHECK flag
        command: echo 'export CHECK=true' >> "$BASH_ENV"
- run:
    name: Derive `.cargo/audit.toml` from the canonical `deny.toml`.
    command: <<include(scripts/sync.sh)>>
    environment:
      LOG_LEVEL: << parameters.log_level >>
