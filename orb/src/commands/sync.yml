description: Derive `.cargo/audit.toml` from the canonical `deny.toml` `[advisories].ignore`. Makes deny.toml the single source of truth
parameters:
  check:
    type: boolean
    description: Fail (non-zero) on drift instead of rewriting the file. For CI
    default: false
steps:
- when:
    condition: << parameters.check >>
    steps:
    - run:
        name: Set CHECK flag
        command: echo 'export CHECK=true' >> "$BASH_ENV"
- run:
    name: Derive `.cargo/audit.toml` from the canonical `deny.toml` `[advisories].ignore`. Makes deny.toml the single source of truth
    command: <<include(scripts/sync.sh)>>
