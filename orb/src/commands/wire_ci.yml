description: 'Wire the generated jerus-org/jci-audit orb job(s) into a consumer''s `CircleCI` config. `jci-audit.toml`''s own `[ci]` table is the required, authoritative spec — not CLI flags: `[ci].file` names the `CircleCI` config to patch (default `.circleci/config.yml`), and each `[[ci.jobs]]` entry describes one job to wire into one workflow (`workflow`, `orb_job`, `orb_version`, `job_name`, `requires`, `required_by`). On a repo with no `[[ci.jobs]]` entries yet, this scaffolds one example into `jci-audit.toml` — review and adapt it by hand, then re-run to apply it. See jerus-org/jci-audit#101 (PR 1: this job''s own workflow) and #164 (follow-on: the release workflow''s multi-job chain).'
parameters:
  verbose:
    type: boolean
    description: Increase logging verbosity
    default: false
  quiet:
    type: boolean
    description: Decrease logging verbosity
    default: false
  config:
    type: string
    description: Path to the jci-audit.toml-shaped wiring spec to read (and, if it has no `[[ci.jobs]]` entries yet, scaffold an example into). Defaults to `jci-audit.toml` relative to the nearest deny.toml above the current directory. An explicit value is used as given — `[ci].file` (the `CircleCI` config to patch) then resolves relative to ITS OWN parent directory, not the workspace root.
    default: ''
  check:
    type: boolean
    description: Fail (non-zero) on drift — or if `[[ci.jobs]]` isn't configured yet — instead of writing. For CI
    default: false
steps:
- when:
    condition: << parameters.verbose >>
    steps:
    - run:
        name: Set VERBOSE flag
        command: echo 'export VERBOSE=true' >> "$BASH_ENV"
- when:
    condition: << parameters.quiet >>
    steps:
    - run:
        name: Set QUIET flag
        command: echo 'export QUIET=true' >> "$BASH_ENV"
- when:
    condition: << parameters.check >>
    steps:
    - run:
        name: Set CHECK flag
        command: echo 'export CHECK=true' >> "$BASH_ENV"
- run:
    name: Wire the generated jerus-org/jci-audit orb job(s) into a consumer's `CircleCI` config.
    command: <<include(scripts/wire_ci.sh)>>
    environment:
      CONFIG: << parameters.config >>
