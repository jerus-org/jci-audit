description: Re-verify a past release against its recorded advisory snapshot. Uses the policy (deny.toml) that was in force at the time. Run it from a checkout of the released tag.
parameters:
  release_version:
    type: string
    description: The released version to verify (e.g. "1.2.0")
  advisory_db:
    type: string
    description: Advisory-db root; the checkout is moved to the recorded commit. Defaults to ~/.cargo/advisory-db.
    default: ''
  owner:
    type: string
    description: GitHub repository owner that published the release (e.g. "jerus-org"). Needed to fetch the release when no local record is found.
    default: ''
  repo:
    type: string
    description: GitHub repository name that published the release (e.g. "jci-audit"). Needed to fetch the release when no local record is found.
    default: ''
  tag_prefix:
    type: string
    description: Release tag prefix (e.g. "jci-audit-v"); combined with --release-version to form the tag to fetch when no local record is found
    default: ''
  deny_warnings:
    type: boolean
    description: Fail if the tools report any warning
    default: false
  verbose:
    type: boolean
    description: Increase logging verbosity
    default: false
  quiet:
    type: boolean
    description: Decrease logging verbosity
    default: false
steps:
- when:
    condition: << parameters.deny_warnings >>
    steps:
    - run:
        name: Set DENY_WARNINGS flag
        command: echo 'export DENY_WARNINGS=true' >> "$BASH_ENV"
- when:
    condition: << parameters.verbose >>
    steps:
    - run:
        name: Set VERBOSE flag
        command: echo 'export VERBOSE=true' >> "$BASH_ENV"
- when:
    condition: << parameters.quiet >>
    steps:
    - run:
        name: Set QUIET flag
        command: echo 'export QUIET=true' >> "$BASH_ENV"
- run:
    name: Re-verify a past release against its recorded advisory snapshot. Uses the policy (deny.toml) that was in force at the time. Run it from a checkout of the released tag.
    command: <<include(scripts/verify.sh)>>
    environment:
      RELEASE_VERSION: << parameters.release_version >>
      ADVISORY_DB: << parameters.advisory_db >>
      OWNER: << parameters.owner >>
      REPO: << parameters.repo >>
      TAG_PREFIX: << parameters.tag_prefix >>
