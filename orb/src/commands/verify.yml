description: Re-verify a past release against the advisory snapshot it was locked to, using the policy (deny.toml) that was in force at the time. Run it from a checkout of the released tag
parameters:
  verbose:
    type: boolean
    description: '...                 Increase logging verbosity --version <VERSION>          The released version to verify (e.g. "1.2.0") --advisory-db <ADVISORY_DB>  Advisory-db root; cargo-deny''s checkout is moved to the recorded commit beneath it. Defaults to ~/.cargo/advisory-db'
    default: false
  quiet:
    type: boolean
    description: '...                   Decrease logging verbosity --deny-warnings              Fail if the tools report any warning'
    default: false
steps:
- when:
    condition: << parameters.verbose >>
    steps:
    - run:
        name: Set VERBOSE flag
        command: echo 'export VERBOSE=true' >> "$BASH_ENV"
- when:
    condition: << parameters.quiet >>
    steps:
    - run:
        name: Set QUIET flag
        command: echo 'export QUIET=true' >> "$BASH_ENV"
- run:
    name: Re-verify a past release against the advisory snapshot it was locked to, using the policy (deny.toml) that was in force at the time. Run it from a checkout of the released tag
    command: <<include(scripts/verify.sh)>>
