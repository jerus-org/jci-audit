description: Stale-ignore detector for advisory ignores that no longer fire. Runs audit/deny against the naked advisory-db (no local ignores applied) to find configured ignores that no longer fire.
parameters:
  check:
    type: boolean
    description: Fail (non-zero) when a stale ignore is found. For CI
    default: false
  log_level:
    type: enum
    description: 'Logging verbosity: consolidates this tool''s clap-verbosity-flag -q/--quiet and -v/--verbose repeat-counters (its own linked pair) into one selector, so they can''t be set independently and cancel out. clap-verbosity-flag escalates off -> error -> warn -> info -> debug -> trace, typically starting at error: `quiet` is a single -q (one step quieter); `default` is this tool''s own starting point on that scale; `v` / `vv` / `vvv` / `vvvv` are -v / -vv / -vvv / -vvvv (one to four steps louder).'
    default: default
    enum:
    - quiet
    - default
    - v
    - vv
    - vvv
    - vvvv
steps:
- when:
    condition: << parameters.check >>
    steps:
    - run:
        name: Set CHECK flag
        command: echo 'export CHECK=true' >> "$BASH_ENV"
- run:
    name: Stale-ignore detector for advisory ignores that no longer fire.
    command: <<include(scripts/prune.sh)>>
    environment:
      LOG_LEVEL: << parameters.log_level >>
