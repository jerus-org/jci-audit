description: >
  Record a release's security validation, and get it committed, before the crate
  is released.

  The record attests that the release passed the gate against a known advisory
  snapshot, so the release can be re-verified later with `jci-audit verify`. It
  must be committed BEFORE the release tool runs: cargo-release refuses to start
  on a dirty tree, so a file merely left in place would abort it. Ordering the
  record first also makes it an ancestor of the release commit, and so part of
  the tagged tree.

  PUSHING IS YOURS TO DO, and this example is shaped around that. The executor
  carries no credentials, and no push tooling beyond git — deliberately, because
  a protected branch typically rejects a direct push however much write access
  the pusher holds, and accepts only a credential its rules permit to bypass
  them (a GitHub App installation token, say). Which credential that is, and how
  your organisation grants it, is not something this orb can know.

  So the recording job writes the record and hands it on through the workspace,
  and a job of your own commits and pushes it with whatever your branch rules
  accept. Carrying the FILE rather than a commit matters: a push job that checks
  out afresh would discard a commit made in an earlier job.

  If your branch has no such rules — or the job already holds a credential they
  accept — the `commit` and `push` parameters will do it in one step instead, and
  the signing material is then read from the environment variables named by the
  `*_env` parameters (defaults GPG_KEY, GPG_TRUST, GIT_USER_NAME, GIT_USER_EMAIL,
  GPG_SIGN_KEY). Signing is skipped when no key is present, which is usually what
  you want locally and rarely what you want in CI.

  Supply the version either as the `release_version` parameter, or by exporting it (the
  `version_env` parameter names the variable, default SEMVER) when your pipeline
  computes it at runtime.
usage:
  version: 2.1
  orbs:
    jci-audit: jerus-org/jci-audit@0.0.2
  workflows:
    release:
      jobs:
        - jci-audit/release:
            name: record-release
            # Explicit version. Omit this and export SEMVER instead when the
            # version is calculated during the pipeline.
            release_version: "1.2.0"
            # Hand the record on as a FILE. A push job that checks out afresh
            # would discard a commit made here.
            post-steps:
              - persist_to_workspace:
                  root: .
                  paths:
                    - .security

        # Your own job: commit the record and push it with a credential your
        # branch rules accept. It should attach the workspace, copy .security/
        # into the tree, then commit (signed) and push.
        - your-commit-and-push-job:
            requires: [record-release]

        # Release the crate only after the record is on the branch, so the
        # release starts from a clean tree that already contains it.
        - your-release-job:
            requires: [your-commit-and-push-job]
