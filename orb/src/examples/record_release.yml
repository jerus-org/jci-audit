description: >
  Run the release gate before the crate is released, and record its security
  validation.

  The record attests that the release passed the gate against a known advisory
  snapshot, so the release can be re-verified later with `jci-audit verify`. It
  is written to `.security/release-<VERSION>.json` in the job's own working
  directory and left there — the job does not commit, sign, or push it. If you
  want to inspect it, persist it to the workspace or store it as a build
  artifact, as this example does.

  Distributing the record as a signed release asset (alongside the crate's
  other signed artifacts) is tracked in
  https://github.com/jerus-org/jci-audit/issues/75 and not yet available
  through this orb.

  Supply the version either as the `release_version` parameter, or by exporting
  it (the `version_env` parameter names the variable, default SEMVER) when your
  pipeline computes it at runtime.
usage:
  version: 2.1
  orbs:
    jci-audit: jerus-org/jci-audit@0.0.2
  workflows:
    release:
      jobs:
        - jci-audit/release:
            name: record-release
            # Explicit version. Omit this and export SEMVER instead when the
            # version is calculated during the pipeline.
            release_version: "1.2.0"
            post-steps:
              - store_artifacts:
                  path: .security
                  destination: security-record

        # Release the crate only after the gate has passed.
        - your-release-job:
            requires: [record-release]
