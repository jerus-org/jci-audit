description: >
  Run the release gate before the crate is released, then sign and upload the
  security record to the release as its own set of assets.

  jci-audit/release_prep writes the record, unsigned, to
  `.security/release-<VERSION>.json` in its own job's working directory. It
  does not commit, sign, or push it — persist it to the workspace (as this
  example does) so a later job can pick it up.

  jci-audit/publish_record then generates a one-use minisign keypair, signs
  the record, uploads the record/.sig/.pub as release assets on the given
  tag, and (with `publish: true`) un-drafts the release once they're
  attached. The private key never leaves that one job — it is generated,
  used, and discarded inside it, never passed to or from another step.

  This is the self-contained path (jerus-org/jci-audit#75) for a consumer
  with no equivalent signing facility of their own — it needs nothing beyond
  this orb and a GitHub token with permission to upload assets to (and, with
  `publish: true`, publish) the release. Set that token via a context on the
  publish-record job, not as a parameter — it must never appear on a command
  line or in a CI log.

  Supply the version either as the `release_version` parameter, or by
  exporting it (the `version_env` parameter names the variable, default
  SEMVER) when your pipeline computes it at runtime. `tag` must be the exact
  tag your own release job created the draft release under.
usage:
  version: 2.1
  orbs:
    jci-audit: jerus-org/jci-audit@0.1
  workflows:
    release:
      jobs:
        - jci-audit/release_prep:
            name: record-release
            # Explicit version. Omit this and export SEMVER instead when the
            # version is calculated during the pipeline.
            release_version: "1.2.0"
            post-steps:
              - persist_to_workspace:
                  root: .
                  paths:
                    - .security

        # Creates the draft release however your pipeline normally does.
        - your-draft-release-job:
            requires: [record-release]

        - jci-audit/publish_record:
            name: publish-security-record
            requires: [your-draft-release-job]
            context: [github-release-write]
            attach_workspace: true
            release_version: "1.2.0"
            tag: "myapp-v1.2.0"
            owner: "your-org"
            repo: "your-repo"
            # attach_workspace lands the record under workspace_root
            # (default /tmp/workspace), not inside this job's own fresh
            # checkout — point record_path at it explicitly.
            record_path: "/tmp/workspace/.security/release-1.2.0.json"
            publish: true
