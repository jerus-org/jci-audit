[workspace]
members = ["crates/jci-audit"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Jeremiah Russell <jrussell@jerus.ie>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jerus-org/jci-audit"
rust-version = "1.89"
keywords = ["security", "audit", "cargo-deny", "circleci", "orb"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
# CLI
clap = { version = "4.6.6", features = ["derive"] }
# Verbosity flags, as the organisation's other CLIs declare them. The tracing
# feature rather than the default log one, to match this crate's logging stack.
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }

# Error Handling
anyhow = "1.0.104"
thiserror = "2.0.20"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-log = "0.2.0"

# Config (jci-audit.toml) and TOML editing (deny.toml <-> audit.toml sync)
config = { version = "0.15.25", default-features = false, features = ["toml"] }
toml_edit = "0.25.13"

# Serialization (release record JSON, deny.toml parsing)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Hashing — records which Cargo.lock a release was validated against
sha2 = "0.11.0"

# SPDX license expression parsing/evaluation for the about.toml derivation
# (license_scope) — the same crate cargo-deny itself uses internally, rather
# than reimplementing expression evaluation by hand.
spdx = "0.13.5"

# Testing
tempfile = "3.27.0"
trycmd = "1.2.1"
