[orb]
binary = "jci-audit"
namespaces = ["jerus-org"]
orb_dir = "orb"
home_url = "https://github.com/jerus-org/jci-audit"
source_url = "https://github.com/jerus-org/jci-audit"
# jci-audit orchestrates these tools, so its executor image must carry them.
# Installed into the generated Dockerfile via cargo-binstall (gen-circleci-orb
# >= 0.1.3), keeping the executor self-contained on an official public Rust base
# — no dependency on the internal ci-container image. rsign2's binary is named
# `rsign`, not `rsign2` — the "crate:binary" alias syntax needs gen-circleci-orb
# >= 0.1.8 (#319). Pre-provisions rsign for #88's `verify` remote-fetch path
# (minisign signature check on a fetched release record); the container gains
# the binary here, the call to it lands separately when #88 is implemented.
cargo_tools = ["cargo-audit@0.22.2", "cargo-deny@0.20.2", "cargo-about@0.9.2", "rsign2:rsign@0.6.6"]
# Hand-authored orb files the generator does not produce. Without this the prune
# step would delete them as orphans on the next `generate`.
custom_files = [
    "src/examples/record_release.yml",
    "src/examples/record_release_runtime_version.yml",
]
# Digest-pinned base images for the generated orb/Dockerfile. Pinned here (not
# left to the generator's moving-tag default) so the @sha256 survives every
# regeneration — the Dockerfile is rewritten from this config, so a digest
# Renovate wrote into the Dockerfile would otherwise be stripped. Renovate keeps
# these two values current via a customManager in renovate.json.
builder_image = "rust:1-slim-trixie@sha256:4cd829461bd5c4d511c32e269da9cb8929223b666519d8004e35fc8d1d771ab7"
# The runtime needs a CARGO TOOLCHAIN, not just the tool binaries: cargo-deny
# shells out to `cargo metadata` to build the crate graph, so on a bare
# debian-slim runtime every check fails with "failed to start `cargo metadata`".
# Same image and digest as the builder stage.
base_image = "rust:1-slim-trixie@sha256:4cd829461bd5c4d511c32e269da9cb8929223b666519d8004e35fc8d1d771ab7"

[ci]
build_workflow = "validation"
release_workflow = "release"
requires_job = "toolkit/common_tests"
release_after_job = "release-jci-audit"
crate_tag_prefix = "jci-audit-v"
docker_namespace = "jerusdp"
docker_context = "docker"
orb_context = "orb-publishing"
mcp = false
mcp_context = ["pcu-app"]
mcp_earliest_version = "0.0.1"

[subcommand.init]
interactive = true

[subcommand.verify]
# An auditor's tool, not a CI gate: it answers "did this past release really
# pass?" for a human (or independent third party) checking after the fact,
# not something a pipeline runs on itself. Not wired into any CI config here
# or documented for consumers — see docs/design.md §5.3-5.4.
interactive = true

[subcommand.wire-ci]
# Apply-only, human/local: it writes jci-audit.toml and the CircleCI config
# and has no --check flag at all. A CI job must never be able to rewrite the
# config that is currently running it (jerus-org/jci-audit#163 review
# feedback) — excluding this from orb generation entirely means the only
# CI-facing verb is `check-ci-wiring`, whose CLI surface has no way to write
# in the first place.
interactive = true

# Relocates the regen+record chain off Renovate branches (which it would
# otherwise freeze, gen-circleci-orb#326/#328) and into this repo's existing
# "PR merged"-triggered update_prlog workflow, run last after
# toolkit/update_prlog per the requires-ordering fix in #394, with the
# original validation-workflow chain excluded on qualifying branches per
# #397.
[post_merge_regen]
branch_patterns = ["renovate/*"]
workflow = "update_prlog"
file = "update_prlog.yml"

# A consumer whose pipeline computes its release version at runtime (this
# repo included — toolkit/calculate_versions writes it to
# /tmp/workspace/versions.env, only after an earlier job has run) has no way
# to feed that into `version`, a plain pipeline-compile-time parameter.
# workspace_sourced (gen-circleci-orb#454) adds a `version_env_var`/
# `version_source_file` fallback pair to each job instead — see
# orb/src/examples/record_release_runtime_version.yml.
[subcommand.release-prep.param.version]
workspace_sourced = true

[subcommand.publish-record.param.version]
workspace_sourced = true

[record]
enabled = true
gpg_key_env = "BOT_GPG_KEY"
gpg_trust_env = "BOT_TRUST"
user_name_env = "BOT_USER_NAME"
user_email_env = "BOT_USER_EMAIL"
signing_key_env = "BOT_SIGN_KEY"
push_ssh_fingerprint = "SHA256:OkxsH8Z6Iim6WDJBaII9eTT9aaO1f3eDc6IpsgYYPVg"
contexts = ["release"]
