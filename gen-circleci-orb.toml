[orb]
binary = "jci-audit"
namespaces = ["jerus-org"]
orb_dir = "orb"
home_url = "https://github.com/jerus-org/jci-audit"
source_url = "https://github.com/jerus-org/jci-audit"
# jci-audit orchestrates these tools, so its executor image must carry them.
# Installed into the generated Dockerfile via cargo-binstall (gen-circleci-orb
# >= 0.1.3), keeping the executor self-contained on an official public Rust base
# — no dependency on the internal ci-container image.
cargo_tools = ["cargo-audit", "cargo-deny", "cargo-about"]
# Hand-authored orb files the generator does not produce. Without this the prune
# step would delete them as orphans on the next `generate`.
custom_files = ["src/examples/record_release.yml"]
# Digest-pinned base images for the generated orb/Dockerfile. Pinned here (not
# left to the generator's moving-tag default) so the @sha256 survives every
# regeneration — the Dockerfile is rewritten from this config, so a digest
# Renovate wrote into the Dockerfile would otherwise be stripped. Renovate keeps
# these two values current via a customManager in renovate.json.
builder_image = "rust:1-slim-trixie@sha256:8e8cf8f7fd54a2d23d5a743b3a03f56e26b6c774276c33fa0595111704ebb15c"
# The runtime needs a CARGO TOOLCHAIN, not just the tool binaries: cargo-deny
# shells out to `cargo metadata` to build the crate graph, so on a bare
# debian-slim runtime every check fails with "failed to start `cargo metadata`".
# Same image and digest as the builder stage.
base_image = "rust:1-slim-trixie@sha256:8e8cf8f7fd54a2d23d5a743b3a03f56e26b6c774276c33fa0595111704ebb15c"

[ci]
build_workflow = "validation"
release_workflow = "release"
requires_job = "toolkit/common_tests"
release_after_job = "release-jci-audit"
crate_tag_prefix = "jci-audit-v"
docker_namespace = "jerusdp"
docker_context = "docker"
orb_context = "orb-publishing"
# Image the build_rust_binary CI jobs compile in. This configures the CI
# pipeline, not the orb's own container ([orb].base_image does that). The job
# default is rust:latest, which has NO libclang — bindgen then fails on
# openssl-sys, reached through pcu (sequoia-openpgp's OpenSSL backend). This is
# the toolkit's clang-equipped compile image, digest-pinned so it survives
# regeneration; Renovate tracks the digest here and in .circleci/ together.
rust_image = "jerusdp/ci-rust:rolling-6mo@sha256:1fd59ba21c66d2830eefc54289707c7465c1537fef3dcade9e7dc54ccd2403f0"
mcp = false
mcp_context = ["pcu-app"]
mcp_earliest_version = "0.0.1"

[subcommand.init]
interactive = true

[record]
enabled = true
gpg_key_env = "BOT_GPG_KEY"
gpg_trust_env = "BOT_TRUST"
user_name_env = "BOT_USER_NAME"
user_email_env = "BOT_USER_EMAIL"
signing_key_env = "BOT_SIGN_KEY"
push_ssh_fingerprint = "SHA256:OkxsH8Z6Iim6WDJBaII9eTT9aaO1f3eDc6IpsgYYPVg"
contexts = ["release"]
