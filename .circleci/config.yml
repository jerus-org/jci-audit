version: 2.1

parameters:
  min_rust_version:
    type: string
    default: "1.89"

orbs:
  toolkit: jerus-org/circleci-toolkit@7.1.0

  orb-tools: circleci/orb-tools@12.5.0

  # >>> gen-circleci-orb (managed — edits overwritten by 'gen-circleci-orb update')
  gen-circleci-orb: jerus-org/gen-circleci-orb@0.1.6
  # <<< gen-circleci-orb
jobs:
  otterwise_coverage:
    executor: toolkit/rust_env_rolling
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install jq
          command: |
            sudo apt-get update && sudo apt-get install -y jq
      - run:
          name: Generate coverage report
          command: |
            cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - run:
          name: Upload Coverage to OtterWise
          command: |
            bash <(curl -s https://raw.githubusercontent.com/getOtterWise/bash-uploader/main/uploader.sh) --repo-token $OTTERWISE_TOKEN

  
  # This is a separate job because it's a separate check.
  # An unaccepted licence stops the release in its pre-release hook — after the
  # approval gate and the build, at the most expensive point in the pipeline.
  # This asks the same question at PR time instead.
  #
  # It checks that cargo-about can RESOLVE the licences, not that the committed
  # notices match byte for byte: the rendered text varies with what the local
  # cargo cache has unpacked, so comparing bytes here would fail on a correct
  # tree. See the comment in scripts/licenses.sh. `just` is not in the CI image,
  # so the invocation is shared through the script rather than copied here.
  licenses_policy:
    executor: toolkit/rust_env_rolling
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Check every dependency's licence is accepted by the policy
          command: ./scripts/licenses.sh --policy

workflows:
  validation:
    jobs:
      - toolkit/verify_commit_signatures:
          name: verify_commit_signatures_trusted
          context: bot-check
          post_comment: true
          update_pcu: false
          filters:
            branches:
              ignore:
                - main
                - /pull\/[0-9]+/

      - toolkit/verify_commit_signatures:
          name: verify_commit_signatures_forked
          post_comment: false
          update_pcu: false
          filters:
            branches:
              only:
                - /pull\/[0-9]+/

      - toolkit/required_builds:
          min_rust_version: << pipeline.parameters.min_rust_version >>

      - toolkit/optional_builds:
          filters:
            branches:
              ignore: main

      - toolkit/test_doc_build:
          filters:
            branches:
              ignore: main

      # Unfiltered: `security with sonarcloud` requires this job and runs on
      # main, and CircleCI never schedules a job whose `requires` dependency
      # was itself filtered out on that branch (#59).
      - toolkit/idiomatic_rust:
          clippy_report: true

      - toolkit/common_tests:
          min_rust_version: << pipeline.parameters.min_rust_version >>

      # Unfiltered, like the other correctness gates: a dependency arrives with its
      # licence on whatever branch it lands on, and this is the only thing that
      # catches an unaccepted one before a release does.
      - licenses_policy

      - toolkit/security:
          name: security audit only
          sonarcloud: false
          filters:
            branches:
              only:
                - /pull\/[0-9]+/

      - toolkit/security:
          name: security with sonarcloud
          clippy_report: true
          no_sonarcloud_on_main: false
          requires:
            - toolkit/idiomatic_rust
          context: SonarCloud
          filters:
            branches:
              ignore:
                - /pull\/[0-9]+/
      - otterwise_coverage:
          context: Otterwise
          filters:
            branches:
              ignore:
                - /pull\/[0-9]+/
      - toolkit/code_coverage:
          context: SonarCloud
          filters:
            branches:
              ignore:
                - /pull\/[0-9]+/
                - main
      # >>> gen-circleci-orb (managed — edits overwritten by 'gen-circleci-orb update')
      - gen-circleci-orb/build_rust_binary:
          name: build-binary
          package: jci-audit
          rust_image: jerusdp/ci-rust:rolling-6mo@sha256:ac7fa7e1e811f24211f70ac0ebe87c7a27db118535582ef3bb70557f233ab28a
      - gen-circleci-orb/generate:
          name: regenerate-orb
          binary: jci-audit
          orb_namespace: jerus-org
          orb_dir: orb
          attach_workspace: true
          check_ci_wiring: true
          ssh_fingerprint: "SHA256:OkxsH8Z6Iim6WDJBaII9eTT9aaO1f3eDc6IpsgYYPVg"
          persist_orb_workspace: true
          context: [release]
          requires: [build-binary, toolkit/common_tests]
          filters:
            branches:
              ignore:
                - main
      - orb-tools/pack:
          name: pack-orb
          checkout: false
          source_dir: orb/src
          pre-steps:
            - attach_workspace:
                at: .
          requires: [regenerate-orb]
          filters:
            branches:
              ignore:
                - main
      - orb-tools/review:
          name: review-orb
          checkout: false
          source_dir: orb/src
          pre-steps:
            - attach_workspace:
                at: .
          requires: [pack-orb]
          filters:
            branches:
              ignore:
                - main
      # <<< gen-circleci-orb

  # >>> gen-circleci-orb (managed — edits overwritten by 'gen-circleci-orb update')
  orb-release:
    jobs:
      - orb-tools/pack:
          name: orb-release-pack
          checkout: false
          source_dir: orb/src
          pre-steps:
            - checkout
            - run:
                name: Inject release version into executor default tag
                command: |
                  VERSION=${CIRCLE_TAG#jci-audit-v}
                  echo "Injecting version: ${VERSION}"
                  sed -i "s/default: latest/default: ${VERSION}/" orb/src/executors/default.yml
                  echo "Updated executor:"
                  cat orb/src/executors/default.yml
          filters:
            tags:
              only: /^jci-audit-v.*/
            branches:
              ignore: /.*/

      - gen-circleci-orb/build_container:
          name: orb-release-container
          binary: jci-audit
          docker_namespace: jerusdp
          orb_dir: orb
          crate_tag_prefix: jci-audit-v
          context: [docker]
          filters:
            tags:
              only: /^jci-audit-v.*/
            branches:
              ignore: /.*/

      - gen-circleci-orb/ensure_orb_registered:
          name: orb-release-ensure-registered-jerus-org
          orb_name: jerus-org/jci-audit
          context: [orb-publishing]
          filters:
            tags:
              only: /^jci-audit-v.*/
            branches:
              ignore: /.*/

      - orb-tools/publish:
          name: publish-orb-jerus-org
          pre-steps:
            - run:
                name: Normalize CIRCLE_TAG for orb version
                command: |
                  VERSION=${CIRCLE_TAG#jci-audit-v}
                  echo "export CIRCLE_TAG=v${VERSION}" >> "$BASH_ENV"
          orb_name: jerus-org/jci-audit
          pub_type: production
          vcs_type: github
          enable_pr_comment: false
          requires: [orb-release-container, orb-release-pack, orb-release-ensure-registered-jerus-org]
          context: [orb-publishing]
          filters:
            tags:
              only: /^jci-audit-v.*/
            branches:
              ignore: /.*/
  # <<< gen-circleci-orb
