version: 2.1

parameters:
  jci_audit_version:
    type: string
    default: ""
    description: "Override jci-audit crate version (empty = nextsv auto-detect)"
  workspace_version:
    type: string
    default: ""
    description: "Override workspace v* version (empty = nextsv auto-detect)"

orbs:
  toolkit: jerus-org/circleci-toolkit@7.0.0
  jci-audit: jerus-org/jci-audit@0.0.2

workflows:
  release:
    jobs:
      - toolkit/calculate_versions:
          name: calculate-versions
          verify_tools: true
          crates: "jci-audit:jci-audit-v"
          crate_version_overrides: "jci-audit:<< pipeline.parameters.jci_audit_version >>"
          workspace_version_override: << pipeline.parameters.workspace_version >>

      - approve-release:
          type: approval
          requires: [calculate-versions]

      # Record the security validation BEFORE the crate release. cargo-release
      # refuses to start on a dirty tree, so the record cannot simply be left
      # for it to pick up — it is committed here, which also makes it an
      # ancestor of the release commit and so part of the tagged tree.
      #
      # Dogfoods the orb's own release job. Write authority comes from the
      # pre-step: nothing in the tool carries credentials of its own.
      - jci-audit/release:
          name: record-release
          requires: [approve-release]
          commit: true
          push: true
          context:
            - release
            - bot-check
          pre-steps:
            - add_ssh_keys:
                fingerprints:
                  - "SHA256:OkxsH8Z6Iim6WDJBaII9eTT9aaO1f3eDc6IpsgYYPVg"
            - attach_workspace:
                at: /tmp/release-versions
            - run:
                name: Export the calculated version
                command: |
                  source /tmp/release-versions/versions.env
                  echo "export SEMVER=${SEMVER}" >> "$BASH_ENV"
                  echo "Recording security validation for ${SEMVER}"

      - toolkit/release_crate:
          name: release-jci-audit
          requires: [record-release]
          package: jci-audit
          crate_tag_prefix: jci-audit-v
          build_binary: true
          binary_name: jci-audit
          context:
            - release
            - bot-check
            - pcu-app

      - toolkit/release_prlog:
          requires: [release-jci-audit]
          context:
            - release
            - bot-check
            - pcu-app
