version: 2.1

parameters:
  jci_audit_version:
    type: string
    default: ""
    description: "Override jci-audit crate version (empty = nextsv auto-detect)"
  workspace_version:
    type: string
    default: ""
    description: "Override workspace v* version (empty = nextsv auto-detect)"

orbs:
  toolkit: jerus-org/circleci-toolkit@7.3.0
  jci-audit: jerus-org/jci-audit@0.1.0
  gen-circleci-orb: jerus-org/gen-circleci-orb@0.1.9

# TEMPORARY WORKAROUND — replace with the orb's own release job once an orb
# carrying the current parameter schema is published.
#
# The release workflow should run the PUBLISHED orb job: it is the most critical
# and least exercised path, and pinning it to a released artefact keeps a bug on
# the tip from breaking the very pipeline needed to ship the fix.
#
# It is hand-rolled only because the published orb can express neither the new
# flags nor an optional version, and no new orb can be published without a
# working release — a deadlock that has to be broken once. It also cannot use the
# orb's executor yet: that image has no cargo toolchain, so cargo-deny cannot run
# `cargo metadata` (fixed for consumers by basing the orb's runtime on a Rust
# image, which only reaches us once published). The image below carries cargo,
# cargo-deny, cargo-audit, git and gnupg, and is what the release and prlog jobs
# already sign and push from.
#
# Consumers use the orb job — see orb/src/examples/record_release.yml.
jobs:
  record-release:
    executor: toolkit/rust_env_rolling
    steps:
      - checkout
      # One attach: the shared workspace holds both the freshly built binary
      # (from build-binary) and versions.env (from calculate-versions).
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Record the security validation
          command: |
            source /tmp/workspace/versions.env
            # calculate-versions stores each crate as CRATE_VERSION_<NAME>,
            # uppercased with hyphens replaced; SEMVER is derived later by
            # release_crate and is NOT in the file.
            VERSION="${CRATE_VERSION_JCI_AUDIT}"
            if [ -z "${VERSION}" ]; then
              echo "ERROR: CRATE_VERSION_JCI_AUDIT not found in versions.env" >&2
              cat /tmp/workspace/versions.env >&2
              exit 1
            fi
            # The freshly built binary shadows any older one on PATH.
            export PATH="/tmp/workspace:$PATH"
            echo "Recording security validation for ${VERSION}"
            # -v: the tools' full output is opt-in now, and a CI log is exactly
            # where the detail should stay. The record is written locally only
            # (.gitignore'd) — no longer committed; see jerus-org/jci-audit#75
            # for its eventual distribution as a signed release asset.
            jci-audit release-prep \
              --release-version "${VERSION}" \
              --verbose
            # Copy to a version-independent path: store_artifacts can't expand
            # $VERSION in its `path`, and .security/ also holds the tracked
            # README and historical records that don't need re-uploading here.
            cp ".security/release-${VERSION}.json" /tmp/security-record.json
      - store_artifacts:
          path: /tmp/security-record.json
          destination: security-record.json

workflows:
  release:
    jobs:
      - toolkit/calculate_versions:
          name: calculate-versions
          verify_tools: true
          crates: "jci-audit:jci-audit-v"
          crate_version_overrides: "jci-audit:<< pipeline.parameters.jci_audit_version >>"
          workspace_version_override: << pipeline.parameters.workspace_version >>

      - approve-release:
          type: approval
          requires: [calculate-versions]

      # Build the binary from THIS commit. record-release attaches the workspace,
      # so the release is recorded by the code being released rather than by the
      # previous version.
      - gen-circleci-orb/build_rust_binary:
          name: build-binary
          package: jci-audit
          rust_image: jerusdp/ci-rust:rolling-6mo@sha256:b48a099fe67725fde4adf84144f3bb5061323e069566dd763871e09aefd29d59
          requires: [approve-release]

      # Record the security validation BEFORE the crate release. The record is
      # no longer committed (jerus-org/jci-audit#75), so it no longer needs
      # signing/push credentials — no bot-check/pcu-app context required here.
      - record-release:
          requires: [build-binary]
          context:
            - release

      - toolkit/release_crate:
          name: release-jci-audit
          requires: [record-release]
          package: jci-audit
          crate_tag_prefix: jci-audit-v
          build_binary: true
          binary_name: jci-audit
          # Required on repos with GitHub Immutable Releases: without it, the
          # binary tarball/.sig uploads below fail against an already-published
          # release. See digital-prstv/circleci-toolkit#520/#521.
          draft: true
          context:
            - release
            - bot-check
            - pcu-app

      - toolkit/release_prlog:
          requires: [release-jci-audit]
          context:
            - release
            - bot-check
            - pcu-app
