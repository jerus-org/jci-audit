version: 2.1

parameters:
  jci_audit_version:
    type: string
    default: ""
    description: "Override jci-audit crate version (empty = nextsv auto-detect)"
  workspace_version:
    type: string
    default: ""
    description: "Override workspace v* version (empty = nextsv auto-detect)"

orbs:
  toolkit: jerus-org/circleci-toolkit@8.0.1
  jci-audit: jerus-org/jci-audit@0.1.18
  gen-circleci-orb: jerus-org/gen-circleci-orb@0.1.27

workflows:
  release:
    jobs:
      - toolkit/calculate_versions:
          name: calculate-versions
          verify_tools: true
          crates: "jci-audit:jci-audit-v"
          crate_version_overrides: "jci-audit:<< pipeline.parameters.jci_audit_version >>"
          workspace_version_override: << pipeline.parameters.workspace_version >>

      - approve-release:
          type: approval
          requires: [calculate-versions]

      # Build the binary from THIS commit. record-release attaches the workspace,
      # so the release is recorded by the code being released rather than by the
      # previous version.
      - gen-circleci-orb/build_rust_binary:
          name: build-binary
          package: jci-audit
          requires: [approve-release]

      - toolkit/release_crate:
          name: release-jci-audit
          requires: [record-release]
          package: jci-audit
          crate_tag_prefix: jci-audit-v
          build_binary: true
          binary_name: jci-audit
          # Required on repos with GitHub Immutable Releases: without it, the
          # binary tarball/.sig uploads below fail against an already-published
          # release. See digital-prstv/circleci-toolkit#520/#521.
          draft: true
          # jerus-org/jci-audit#75 phase 2, path A: sign the unsigned record
          # record-release staged under the shared workspace with the SAME
          # ephemeral key that signs the binary tarball (crates.io-anchored
          # trust, via inject_pubkey_and_amend below), then upload it, its
          # signature, and its pubkey as release assets while the draft is
          # still open. See digital-prstv/circleci-toolkit#533 for the two
          # generic hooks this relies on.
          pre_binary_sign_steps:
            - attach_workspace:
                at: /tmp/workspace
            - toolkit/sign_binary:
                asset_path: /tmp/workspace/.security/release-${SEMVER}.json
                delete_key_after: false
          pre_publish_steps:
            - run:
                name: Write the record's pubkey asset
                command: |
                  set -eo pipefail
                  VERSION="${SEMVER:-${NEXT_VERSION:-none}}"
                  if [ "$VERSION" = "none" ] || [ "$SKIP_RELEASE" = "true" ]; then
                    echo "Skipping record pubkey write (no version, or already released)"
                    exit 0
                  fi
                  echo "${BINSTALL_SIGNING_PUBKEY}" \
                    > /tmp/workspace/.security/release-${VERSION}.json.pub
            - toolkit/upload_release_asset:
                asset_path: /tmp/workspace/.security/release-${SEMVER}.json
                release_tag: jci-audit-v${SEMVER}
            - toolkit/upload_release_asset:
                asset_path: /tmp/workspace/.security/release-${SEMVER}.json.sig
                release_tag: jci-audit-v${SEMVER}
            - toolkit/upload_release_asset:
                asset_path: /tmp/workspace/.security/release-${SEMVER}.json.pub
                release_tag: jci-audit-v${SEMVER}
          context:
            - release
            - bot-check
            - pcu-app

      - toolkit/release_prlog:
          requires: [release-jci-audit]
          context:
            - release
            - bot-check
            - pcu-app
      # >>> jci-audit wire-ci (managed — edits overwritten by re-running 'jci-audit wire-ci')
      - jci-audit/release_prep:
          name: record-release
          version_env_var: CRATE_VERSION_JCI_AUDIT
          log_level: v
          requires: [build-binary]
          context: [release]
          attach_workspace: true
          post-steps:
            - persist_to_workspace:
                root: .
                paths:
                  - .security
      # <<< jci-audit wire-ci
