version: 2.1

parameters:
  jci_audit_version:
    type: string
    default: ""
    description: "Override jci-audit crate version (empty = nextsv auto-detect)"
  workspace_version:
    type: string
    default: ""
    description: "Override workspace v* version (empty = nextsv auto-detect)"

orbs:
  toolkit: jerus-org/circleci-toolkit@7.0.0
  jci-audit: jerus-org/jci-audit@0.0.2
  gen-circleci-orb: jerus-org/gen-circleci-orb@0.1.4

# Hand-rolled rather than the orb's own release job, and deliberately so: the
# published orb's job schema and its baked-in binary are always one release
# behind, so a capability could never be used by the release that introduces it.
# This job takes the executor from the orb (which carries cargo-audit,
# cargo-deny, git and gnupg) but runs the binary built from this commit.
# Consumers use the orb job — see orb/src/examples/record_release.yml.
jobs:
  record-release:
    # Not the orb's executor: the published 0.0.2 image has no cargo toolchain,
    # so cargo-deny cannot run `cargo metadata`. Fixed for consumers by basing
    # the orb's runtime on a Rust image, but that only reaches us once published.
    # This image carries cargo, cargo-deny, cargo-audit, git and gnupg — the same
    # executor the release and prlog jobs sign and push from.
    executor: toolkit/rust_env_rolling
    steps:
      # main's rules reject a direct push, so the record is pushed with the
      # GitHub App credentials pcu reads from the pcu-app context — a deploy key
      # cannot bypass them however much write access it carries.
      - checkout
      # One attach: the shared workspace holds both the freshly built binary
      # (from build-binary) and versions.env (from calculate-versions).
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Record the security validation
          command: |
            source /tmp/workspace/versions.env
            # calculate-versions stores each crate as CRATE_VERSION_<NAME>,
            # uppercased with hyphens replaced; SEMVER is derived later by
            # release_crate and is NOT in the file.
            VERSION="${CRATE_VERSION_JCI_AUDIT}"
            if [ -z "${VERSION}" ]; then
              echo "ERROR: CRATE_VERSION_JCI_AUDIT not found in versions.env" >&2
              cat /tmp/workspace/versions.env >&2
              exit 1
            fi
            export PATH="/tmp/workspace:$PATH"
            echo "Recording security validation for ${VERSION}"
            jci-audit release \
              --version "${VERSION}" \
              --commit \
              --push \
              --gpg-key-env BOT_GPG_KEY \
              --gpg-trust-env BOT_TRUST \
              --user-name-env BOT_USER_NAME \
              --user-email-env BOT_USER_EMAIL \
              --sign-key-env BOT_SIGN_KEY
      # Record the security validation BEFORE the crate release. cargo-release
      # refuses to start on a dirty tree, so the record cannot simply be left
      # for it to pick up — committing it here also makes it an ancestor of the
      # release commit, and so part of the tagged tree.
      - record-release:
          requires: [build-binary]
          context:
            - release
            - bot-check
            - pcu-app

      - toolkit/release_crate:
          name: release-jci-audit
          requires: [record-release]
          package: jci-audit
          crate_tag_prefix: jci-audit-v
          build_binary: true
          binary_name: jci-audit
          context:
            - release
            - bot-check
            - pcu-app

      - toolkit/release_prlog:
          requires: [release-jci-audit]
          context:
            - release
            - bot-check
            - pcu-app
